<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-label="DSA Explainer system architecture">
  <rect width="980" height="640" fill="#0f172a"/>
  <text x="40" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Data Structure Explainer — System Architecture</text>
  <text x="40" y="68" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Structured plan → verify → local TTS → render (wrong plans never export)</text>

  <!-- Learner inputs -->
  <rect x="40" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Learner UI / CLI</text>
  <text x="140" y="150" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">topic + level + revise</text>

  <!-- Planner -->
  <rect x="290" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="390" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">1. Lesson Planner</text>
  <text x="390" y="150" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">LLM or offline templates</text>

  <!-- Schema -->
  <rect x="540" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="640" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Scene Plan JSON</text>
  <text x="640" y="150" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">validated ActionType schema</text>

  <!-- Verifier -->
  <rect x="390" y="220" width="220" height="80" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="252" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">3. Step Verifier</text>
  <text x="500" y="272" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">run real DS/algo in code</text>
  <text x="500" y="290" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">fail → refuse render</text>

  <!-- Narration -->
  <rect x="80" y="360" width="200" height="80" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="180" y="392" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">4. Narration + TTS</text>
  <text x="180" y="412" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Piper (local only)</text>

  <!-- Renderer -->
  <rect x="390" y="360" width="220" height="80" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="392" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">2. Animation Renderer</text>
  <text x="500" y="412" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Manim draws plan actions</text>

  <!-- Quiz -->
  <rect x="700" y="360" width="200" height="80" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
  <text x="800" y="392" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">5. Quiz Generator</text>
  <text x="800" y="412" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">answers verified in code</text>

  <!-- Output -->
  <rect x="290" y="500" width="400" height="70" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="490" y="530" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Output: lesson.mp4 (≥30s) + quiz cards</text>
  <text x="490" y="550" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">6. Revision Control can re-run only changed scenes</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="240" y1="135" x2="290" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="135" x2="540" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="170" x2="500" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="300" x2="180" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="500" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="300" x2="800" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="440" x2="400" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="440" x2="490" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="440" x2="580" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="610" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Local: Piper TTS, Manim, verifier, templates · Cloud optional: OpenAI-compatible planner API</text>
</svg>
