[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-explainer"
version = "0.1.0"
description = "Narrated Data Structures & Algorithms video explainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "typer[all]>=0.12.0",
  "rich>=13.7.0",
  "jsonschema>=4.21.0",
  "python-dotenv>=1.0.0",
  "openai>=1.30.0",
  "httpx>=0.27.0",
  "manim>=0.18.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "pydub>=0.25.1",
  "piper-tts>=1.2.0",
  "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[project.scripts]
dsa-explainer = "dsa_explainer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
